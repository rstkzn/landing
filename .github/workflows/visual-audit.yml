name: Visual audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit.yml'
      - 'index.html'
      - 'styles.css'
      - 'script.js'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live responses and capture browser screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          SITE="https://rstkzn.github.io/landing/"
          for FILE in "" "styles.css" "script.js"; do
            echo "URL ${SITE}${FILE}"
            curl -sSL -o "/tmp/site_${FILE//\//_}" -w 'HTTP %{http_code}; size %{size_download}; time %{time_total}\n' --fail "${SITE}${FILE}"
          done
          echo "Wait for the deployed CV version"
          for i in $(seq 1 30); do
            if curl -fsSL "${SITE}" | grep -q "10 TB in 10 hours" && curl -fsSL "${SITE}styles.css" | grep -q "position-primary"; then echo "Current CV and CSS are live"; break; fi
            echo "Waiting for Pages deployment: $i"; sleep 5
          done
          echo "Style marker from live CSS:"
          curl -fsSL "${SITE}styles.css" | grep -o "position-primary" | head -1
          echo "Chrome: $(command -v google-chrome || true)"
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --window-size=1440,1000 --virtual-time-budget=2500 --screenshot=screenshots/desktop.png "${SITE}" >/tmp/chrome-desktop.log 2>&1 || { cat /tmp/chrome-desktop.log; exit 1; }
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=2500 --screenshot=screenshots/mobile.png "${SITE}" >/tmp/chrome-mobile.log 2>&1 || { cat /tmp/chrome-mobile.log; exit 1; }
          ls -lh screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-audit
          path: screenshots/
          retention-days: 2
