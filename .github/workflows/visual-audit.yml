name: CV website checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-audit.yml'
      - 'index.html'
      - 'styles.css'
      - 'script.js'
      - 'pdf.js'
      - 'content/**'
      - 'config/**'
      - 'assets/**'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Markdown structure, dynamic roles and typography
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const script = fs.readFileSync('script.js', 'utf8');
          const parser = script.match(/function parseExperience\(markdown\) \{[\s\S]*?\n\}\n\nfunction renderInlineMarkdown/);
          assert.ok(parser, 'Markdown parser function exists');
          const parse = new Function(parser[0].replace(/\n\nfunction renderInlineMarkdown$/, '') + '\nreturn parseExperience;')();
          for(const lang of ['en','ru']){
            const markdown = fs.readFileSync('content/experience.' + lang + '.md','utf8');
            const roles = parse(markdown);
            assert.equal(roles.length, 6, 'Existing work history in ' + lang);
            assert.ok(roles.every(r => r.company && r.title && r.dates && r.bullets.length));
            assert.equal(roles.reduce((sum,role)=>sum+role.bullets.length,0),51,'All updated job responsibilities present in ' + lang);
            assert.equal(roles[2].bullets.length,8,'SberDevices details in ' + lang);
            const synthetic = markdown + '\n\n### Synthetic Employer — Database Engineer\n*2027 — Present*\n\n- Extra position.\n\nTechnologies: PostgreSQL\n';
            const added = parse(synthetic);
            assert.equal(added.length,7,'New job discovered from Markdown without touching HTML');
            assert.equal(added[6].company,'Synthetic Employer');
            assert.equal(added[6].technologies,'PostgreSQL');
            console.log(lang + ': ' + roles.length + ' roles; synthetic job parsed');
          }
          const ruText=fs.readFileSync('content/experience.ru.md','utf8');
          const enText=fs.readFileSync('content/experience.en.md','utf8');
          const getHeaders = text => [...text.matchAll(/^### (.+)$/gm)].map(m=>m[1]);
          const ruHeaders=getHeaders(ruText), enHeaders=getHeaders(enText);
          assert.equal(ruHeaders.length, enHeaders.length, 'Role count matches');
          assert.equal((ruText.match(/^- /gm)||[]).length,(enText.match(/^- /gm)||[]).length,'All experience bullets translated');
          const firstTools=ruText.split(/технологии и инструменты:/i)[1]?.split('\n')[0] || '';
          assert.ok(!firstTools.trim().endsWith(','), 'No trailing comma in first technologies list');
          const html = fs.readFileSync('index.html','utf8');
          const typography = fs.readFileSync('config/typography.css','utf8');
          assert.match(html,/id="positions"/);
          assert.ok(!html.includes('experience-years'),'No redundant experience date range');
          const css=fs.readFileSync('styles.css','utf8');
          assert.ok(css.includes('list-style-type:"-  "'),'Plain hyphen list markers');
          assert.match(css,/\.position-tools\{[^}]*padding:13px 0 0 21px/);
          for(const lang of ['ru','en']){
            const source=fs.readFileSync('content/experience.'+lang+'.md','utf8');
            assert.ok(!/[—–]/.test(source),'No typographic long dashes in '+lang);
          }

          assert.match(html,/id="education"/,'Education section is present');
          const scriptContent = fs.readFileSync('script.js','utf8');
          assert.ok(scriptContent.includes('Автоматизированные системы обработки информации и управления'));
          assert.ok(scriptContent.includes('Automated Information Processing and Control Systems'));
          assert.ok(scriptContent.includes('более чем 12-летним'));
          assert.equal(html.split('linkedin.com/in/rustam-v/').length-1,1,'One LinkedIn link');
          assert.ok(html.includes('mailto:rstkzn@yandex.ru'));
          assert.ok(html.includes('tel:+79173935321'));
          assert.doesNotMatch(html,/<article class="position/);
          assert.match(html,/config\/typography\.css/);
          for(const variable of ['--work-description-size','--work-description-line-height','--work-bullet-gap']){
            assert.ok(typography.includes(variable), 'Config has ' + variable);
          }
          assert.match(typography,/border-radius:\s*50%/);
          assert.match(typography,/filter:\s*none/);
          const pdfSource=fs.readFileSync('pdf.js','utf8');
          new Function(pdfSource);
          assert.ok(html.includes('id="download-pdf"'),'Download control is present');
          assert.ok(html.includes('src="pdf.js"'),'PDF script is included');
          assert.ok(script.includes('downloadPdf: "Скачать PDF ↓"'),'Russian button translation');
          assert.ok(script.includes('downloadPdf: "Download PDF ↓"'),'English button translation');
          assert.ok(pdfSource.includes('getFreshRoles'),'PDF uses Markdown content');
          console.log('PDF source and translations: OK');
          console.log('Dynamic rendering, editable config and circular color portrait: OK');
          NODE
      - name: Check live URL and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots
          SITE="https://rstkzn.github.io/landing/"
          for FILE in "" "styles.css" "script.js" "config/typography.css" "content/experience.en.md" "content/experience.ru.md"; do
            echo "Checking ${SITE}${FILE}"
            curl -fsSL "${SITE}${FILE}" -o /dev/null
          done
          # Pages may deploy after this workflow starts. Wait for the new dynamic version.
          for i in $(seq 1 30); do
            if curl -fsSL "${SITE}" | grep -q 'id="education"' && curl -fsSL "${SITE}script.js" | grep -q 'Automated Information Processing and Control Systems' && curl -fsSL "${SITE}content/experience.en.md" | grep -q 'more than 600 PostgreSQL clusters'; then
              echo "Current dynamic CV is live"
              break
            fi
            echo "Waiting for current Pages build ($i)"
            sleep 5
          done
          # Allow GitHub Pages time to expose the newly committed binary asset.
          photo_available=false
          for attempt in $(seq 1 36); do
            if curl -fsSL "${SITE}assets/profile.webp" -o /tmp/profile.webp && test "$(wc -c </tmp/profile.webp)" -gt 4000; then
              photo_available=true
              break
            fi
            echo "Profile image not yet deployed ($attempt)"
            sleep 5
          done
          test "$photo_available" = true
          test "$(wc -c </tmp/profile.webp)" -gt 4000
          file /tmp/profile.webp | grep -q "Web/P image"
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=4500 --dump-dom "${SITE}" > /tmp/rendered.html 2>/tmp/chrome-errors.txt
          grep -q 'assets/profile.webp' /tmp/rendered.html
          grep -q 'mailto:rstkzn@yandex.ru' /tmp/rendered.html
          grep -q 'tel:+79173935321' /tmp/rendered.html
          grep -q 'position position-primary' /tmp/rendered.html
          grep -q '10 TB in 10 hours' /tmp/rendered.html
          grep -q 'Automated Information Processing and Control Systems' /tmp/rendered.html
          grep -q 'OpenAI Codex' /tmp/rendered.html
          grep -q 'more than 600 PostgreSQL clusters' /tmp/rendered.html
          grep -q 'id="download-pdf"' /tmp/rendered.html
          if grep -q 'Could not load work history' /tmp/rendered.html; then echo "Markdown failed to load"; exit 1; fi
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=4500 --screenshot=screenshots/desktop.png "${SITE}" >/tmp/chrome-desktop.log 2>&1
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1366,768 --virtual-time-budget=4500 --screenshot=screenshots/laptop.png "${SITE}" >/tmp/chrome-laptop.log 2>&1
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=4500 --screenshot=screenshots/mobile.png "${SITE}" >/tmp/chrome-mobile.log 2>&1
          ls -lh screenshots
      - name: Verify generated English and Russian PDFs in Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund puppeteer-core@24.15.0
          mkdir -p pdf-check
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            try {
              for(const lang of ['en','ru']) {
                const page = await browser.newPage();
                page.on('console', msg => console.log('BROWSER '+lang+' '+msg.type()+': '+msg.text()));
                page.on('pageerror', err => console.error('BROWSER '+lang+' error: '+err.stack));
                page.on('requestfailed', req => console.error('BROWSER '+lang+' request failed: '+req.url()+' '+JSON.stringify(req.failure())));
                const folder = path.resolve('pdf-check');
                const client = await page.createCDPSession();
                await client.send('Page.setDownloadBehavior', { behavior: 'allow', downloadPath: folder });
                await page.goto('https://rstkzn.github.io/landing/', {waitUntil:'networkidle2',timeout:45000});
                await page.waitForSelector('#download-pdf:not([disabled])',{timeout:20000});
                if(lang === 'ru') {
                  await page.click('#lang');
                  await page.waitForFunction(() => document.documentElement.lang === 'ru' && document.querySelectorAll('#positions article').length >= 6);
                }
                const layout=await page.evaluate(() => {
                  const item=document.querySelector('#positions .position li');
                  const tech=document.querySelector('#positions .position .tools-list');
                  if(!item || !tech) return null;
                  const left=item.getBoundingClientRect().left+parseFloat(getComputedStyle(item).paddingLeft);
                  const techLeft=tech.getBoundingClientRect().left;
                  const headings=[...document.querySelectorAll('#positions .position-date')].map(e=>e.textContent);
                  return {left,techLeft,headings,visiblePeriod:!!document.getElementById('experience-years')};
                });
                assert.ok(layout,'Experience and technologies rendered in '+lang);
                assert.ok(Math.abs(layout.left-layout.techLeft)<3,'Technology left edge follows bullet text: '+JSON.stringify(layout));
                assert.ok(!layout.visiblePeriod,'No redundant experience period');
                assert.ok(layout.headings.every(s=>!/[—–]/.test(s)),'Dates use normal hyphen');
                const filename = 'Rustam_Valeev_CV_' + lang.toUpperCase() + '.pdf';
                const filepath = path.join(folder,filename);
                try { fs.unlinkSync(filepath); } catch (_) {}
                await page.click('#download-pdf');
                let complete = false;
                for(let n=0;n<100;n++) {
                  await new Promise(resolve => setTimeout(resolve,500));
                  if(fs.existsSync(filepath) && fs.statSync(filepath).size > 2000) {
                    const b=fs.readFileSync(filepath);
                    if(b.subarray(0,5).toString() === '%PDF-') { complete=true; break; }
                  }
                  const status=await page.$eval('#pdf-download-status',el=>el.textContent);
                  if(status.includes('failed') || status.includes('Не удалось'))throw Error('PDF generation failed: '+status);
                }
                assert.ok(complete,lang+': no downloaded PDF');
                console.log(lang+': generated '+filename+' ('+fs.statSync(filepath).size+' bytes)');
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          if command -v pdftotext >/dev/null 2>&1; then
            pdftotext -layout pdf-check/Rustam_Valeev_CV_EN.pdf pdf-check/en.txt
            pdftotext -layout pdf-check/Rustam_Valeev_CV_RU.pdf pdf-check/ru.txt
            grep -q 'SberDevices' pdf-check/en.txt
            grep -q 'Exness' pdf-check/ru.txt
            grep -q 'Казанский' pdf-check/ru.txt
            grep -q 'Automated Information Processing' pdf-check/en.txt
            echo "PDF text content verified in both languages"
          fi
      - name: Archive editable project and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustam-portfolio-project
          path: |
            index.html
            script.js
            pdf.js
            styles.css
            content/
            config/
            assets/
            README.md
            screenshots/
            pdf-check/
          retention-days: 7
